name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/cd/requirements-ci.txt

      - name: Install
        run: bash ci/cd/install.sh

      - name: Lint
        run: bash ci/cd/lint.sh

      - name: Test
        run: bash ci/cd/test.sh

      - name: Security
        run: bash ci/cd/security.sh
